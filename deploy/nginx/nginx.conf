user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Do not log personal form values, search queries, referrers or raw IPs.
    log_format request_summary '$time_iso8601 "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $request_time';
    access_log /dev/stdout request_summary;

    client_max_body_size 38m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 20s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # The HTTPS ingress is the sole HSTS authority for public responses.
    proxy_hide_header Strict-Transport-Security;

    # Only verified Cloudflare source networks may set CF-Connecting-IP.
    # An empty include disables Cloudflare-specific client-IP interpretation.
    include /etc/nginx/cloudflare-realip.conf;
    limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=public_forms:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_requests:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_status 429;

    include /tmp/nginx-conf/default.conf;
}
