# Official signed signature updates; no private or unsigned signature sources.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes
Checks 12
MaxAttempts 2
ConnectTimeout 15
ReceiveTimeout 60
ScriptedUpdates yes
NotifyClamd /etc/clamav/clamd.conf
# Avoid a second full engine alongside clamd on small hosts. CVD signature
# verification remains enabled; clamd validates databases when loading them.
TestDatabases no
