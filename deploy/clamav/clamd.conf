# Private INSTREAM service; never publish TCP 3310 to the host or Internet.
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 7
User clamav
Foreground yes
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogRotate yes
LogTime yes
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 8
MaxConnectionQueueLength 8
CommandReadTimeout 10
ReadTimeout 45
SendBufTimeout 1000
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 25M
MaxScanTime 30000
MaxRecursion 16
MaxFiles 1000
ScanPDF yes
ScanArchive yes
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
ConcurrentDatabaseReload no
SelfCheck 600
ExitOnOOM yes
EnableShutdownCommand no
EnableReloadCommand yes
EnableVersionCommand yes
EnableStatsCommand no
Bytecode yes
BytecodeUnsigned no
