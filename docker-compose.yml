name: trailer-parts

# Local infrastructure/worker stack only. For production:
# - set DJANGO_ENV=production and unique secrets (see .env.example)
# - do not publish 5432/6379 outside localhost
# - put Django/Next behind HTTPS reverse proxy
services:
  postgres:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trailer_parts}
      POSTGRES_USER: ${POSTGRES_USER:-trailer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    # protected-mode with no password rejects every non-loopback client
    # (Docker port publishes and peer containers). Always require a password.
    # Compose interpolates the password into argv; do not rely on shell expansion.
    environment:
      # Consumed by the healthcheck via REDISCLI_AUTH (avoids `redis-cli -a`,
      # which leaks the password into process listings and logs).
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --protected-mode
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  celery:
    build:
      context: ./backend
    restart: unless-stopped
    # The non-root worker needs no Linux capabilities or SUID elevation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: uv run celery -A config worker --hostname=celery@%h --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A config inspect --destination celery@$$HOSTNAME ping -t 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Pass raw credentials as components; settings encodes Redis URLs and
      # passes PostgreSQL passwords directly, preserving #, @, /, % and :.
      DATABASE_URL: ${CELERY_DATABASE_URL:-}
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${POSTGRES_DB:-trailer_parts}
      DJANGO_DB_USER: ${POSTGRES_USER:-trailer}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: ${CELERY_REDIS_URL:-}
      DJANGO_REDIS_HOST: redis
      DJANGO_REDIS_PORT: "6379"
      DJANGO_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # The API's host-side DJANGO_CACHE_URL may point at localhost. Containers
      # must use the service address, or an explicit worker-specific override.
      DJANGO_CACHE_URL: ${CELERY_CACHE_URL:-}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-False}
      DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-0}
      DJANGO_PUBLIC_MEDIA_URL: ${DJANGO_PUBLIC_MEDIA_URL:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_REQUIRED: ${TURNSTILE_REQUIRED:-False}
      TURNSTILE_TIMEOUT: ${TURNSTILE_TIMEOUT:-8}
      ATTACHMENT_SCANNER_COMMAND: ${ATTACHMENT_SCANNER_COMMAND:-}
      ATTACHMENT_SCAN_TIMEOUT: ${ATTACHMENT_SCAN_TIMEOUT:-60}
      ATTACHMENT_ALLOW_UNSCANNED_IN_DEVELOPMENT: ${ATTACHMENT_ALLOW_UNSCANNED_IN_DEVELOPMENT:-False}
      CELERY_REDIS_SOCKET_CONNECT_TIMEOUT: ${CELERY_REDIS_SOCKET_CONNECT_TIMEOUT:-1}
      CELERY_REDIS_SOCKET_TIMEOUT: ${CELERY_REDIS_SOCKET_TIMEOUT:-2}
      CELERY_TASK_PUBLISH_MAX_RETRIES: ${CELERY_TASK_PUBLISH_MAX_RETRIES:-2}
      CELERY_TASK_PUBLISH_RETRY_INTERVAL: ${CELERY_TASK_PUBLISH_RETRY_INTERVAL:-0.25}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-website@localhost}
      SALES_NOTIFICATION_EMAIL: ${SALES_NOTIFICATION_EMAIL:-sales@localhost}
      DJANGO_PUBLIC_BASE_URL: ${DJANGO_PUBLIC_BASE_URL:-http://localhost:8000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      - ./backend/private_media:/app/private_media

volumes:
  postgres_data:
  redis_data:
